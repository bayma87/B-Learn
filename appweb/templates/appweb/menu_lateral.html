<style>
    .menu-lateral-abrir {
        width: 44px;
        height: 44px;
        padding: 0;
        border: 0;
        background: transparent;
        display: inline-flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 7px;
        cursor: pointer;
    }

    .menu-lateral-abrir span {
        display: block;
        width: 30px;
        height: 2px;
        border-radius: 999px;
        background: #f3e7ef;
    }

    .menu-lateral-abrir:focus-visible,
    .menu-lateral-fechar:focus-visible,
    .menu-lateral nav a:focus-visible {
        outline: 2px solid #f2d7af;
        outline-offset: 3px;
    }

    .menu-lateral-fundo {
        position: fixed;
        inset: 0;
        z-index: 1000;
        background: rgba(0, 0, 0, 0.6);
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease, visibility 0s linear 0.3s;
    }

    .menu-lateral-fundo.aberto {
        opacity: 1;
        visibility: visible;
        transition: opacity 0.3s ease;
    }

    .menu-lateral {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        z-index: 1001;
        width: min(320px, 85vw);
        padding: 20px;
        overflow-y: auto;
        background: #1b081f;
        border-right: 1px solid rgba(255, 255, 255, 0.14);
        color: #f3e7ef;
        transform: translateX(-100%);
        visibility: hidden;
        transition: transform 0.3s ease, visibility 0s linear 0.3s;
    }

    .menu-lateral.aberto {
        transform: translateX(0);
        visibility: visible;
        transition: transform 0.3s ease;
    }

    .menu-lateral-topo {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
    }

    .menu-lateral-titulo {
        font-weight: 700;
        letter-spacing: 0.12em;
    }

    .menu-lateral-fechar {
        width: 42px;
        height: 42px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.03);
        color: #f3e7ef;
        font-size: 1.4rem;
        line-height: 1;
        cursor: pointer;
    }

    .menu-lateral nav {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .menu-lateral nav a {
        display: flex;
        align-items: center;
        min-height: 48px;
        padding: 10px 18px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.03);
        color: #f3e7ef;
        text-decoration: none;
    }

    .menu-lateral nav a:hover {
        background: rgba(255, 255, 255, 0.09);
        border-color: rgba(255, 255, 255, 0.35);
    }

    .menu-lateral nav a[aria-current="page"] {
        border-color: #c464cc;
        color: #f2d7af;
        font-weight: 700;
    }

    @media (prefers-reduced-motion: reduce) {
        .menu-lateral {
            transform: none;
            opacity: 0;
            transition: opacity 0.2s ease, visibility 0s linear 0.2s;
        }

        .menu-lateral.aberto {
            opacity: 1;
            transition: opacity 0.2s ease;
        }
    }
</style>

<button
    type="button"
    class="menu-lateral-abrir"
    id="menu-lateral-abrir"
    aria-label="Abrir menu de navegação"
    aria-expanded="false"
    aria-controls="menu-lateral"
>
    <span></span>
    <span></span>
    <span></span>
</button>

<div class="menu-lateral-fundo" id="menu-lateral-fundo"></div>

<div
    class="menu-lateral"
    id="menu-lateral"
    role="dialog"
    aria-modal="true"
    aria-label="Menu de navegação"
>
    <div class="menu-lateral-topo">
        <span class="menu-lateral-titulo">ESG IMPACT</span>

        <button
            type="button"
            class="menu-lateral-fechar"
            id="menu-lateral-fechar"
            aria-label="Fechar menu"
        >&times;</button>
    </div>

    <nav aria-label="Páginas do site">
        <a href="{% url 'home' %}"
           {% if pagina_atual == 'inicio' %}aria-current="page"{% endif %}>
            Início
        </a>

        <a href="{% url 'painel_residuos' %}"
           {% if pagina_atual == 'residuos' %}aria-current="page"{% endif %}>
            Resíduos
        </a>

        <a href="{% url 'painel_consumo' %}"
           {% if pagina_atual == 'consumo' %}aria-current="page"{% endif %}>
            Consumo
        </a>

        <a href="{% url 'painel_equipamentos' %}"
           {% if pagina_atual == 'equipamentos' %}aria-current="page"{% endif %}>
            Equipamentos
        </a>

        <a href="{% url 'painel_social' %}"
           {% if pagina_atual == 'social' %}aria-current="page"{% endif %}>
            Social
        </a>

        <a href="{% url 'painel_recomendacoes' %}"
           {% if pagina_atual == 'recomendacoes' %}aria-current="page"{% endif %}>
            Recomendações
        </a>

        <a href="{% url 'painel_microlearning' %}"
           {% if pagina_atual == 'microlearning' %}aria-current="page"{% endif %}>
            Aprenda ESG
        </a>

        <a href="{% url 'painel_fornecedores' %}"
           {% if pagina_atual == 'fornecedores' %}aria-current="page"{% endif %}>
            Fornecedores
        </a>

        <a href="{% url 'quem_somos' %}"
           {% if pagina_atual == 'quem_somos' %}aria-current="page"{% endif %}>
            Quem somos
        </a>
    </nav>
</div>

<script>
    (function () {
        const botaoAbrir = document.getElementById('menu-lateral-abrir');
        const botaoFechar = document.getElementById('menu-lateral-fechar');
        const menu = document.getElementById('menu-lateral');
        const fundo = document.getElementById('menu-lateral-fundo');

        function abrir() {
            menu.classList.add('aberto');
            fundo.classList.add('aberto');
            botaoAbrir.setAttribute('aria-expanded', 'true');
            document.body.style.overflow = 'hidden';
            botaoFechar.focus();
        }

        function fechar(devolverFoco = true) {
            menu.classList.remove('aberto');
            fundo.classList.remove('aberto');
            botaoAbrir.setAttribute('aria-expanded', 'false');
            document.body.style.overflow = '';

            if (devolverFoco) {
                botaoAbrir.focus();
            }
        }

        botaoAbrir.addEventListener('click', abrir);
        botaoFechar.addEventListener('click', function () {
            fechar();
        });
        fundo.addEventListener('click', function () {
            fechar();
        });

        document.addEventListener('keydown', function (evento) {
            if (!menu.classList.contains('aberto')) {
                return;
            }

            if (evento.key === 'Escape') {
                fechar();
                return;
            }

            if (evento.key !== 'Tab') {
                return;
            }

            const focaveis = menu.querySelectorAll('a[href], button');
            const primeiro = focaveis[0];
            const ultimo = focaveis[focaveis.length - 1];

            if (evento.shiftKey && document.activeElement === primeiro) {
                evento.preventDefault();
                ultimo.focus();
            } else if (!evento.shiftKey && document.activeElement === ultimo) {
                evento.preventDefault();
                primeiro.focus();
            }
        });

        window.addEventListener('pageshow', function () {
            fechar(false);
        });
    })();
</script>
