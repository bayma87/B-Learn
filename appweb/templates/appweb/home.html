<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLearn</title>

    <style>
        :root {
            --bg: #0a0c10;
            --panel-left: #2b0d2f;
            --panel-right: #0d0f13;
            --panel-mix: #1b081f;
            --line: rgba(255,255,255,0.14);
            --brand: #f2d7af;
            --button-pink: #c464cc;
            --button-pink-dark: #a64eb5;
            --text: #f3e7ef;
            --muted: rgba(244, 232, 241, 0.85);
            --globe-green: #7bbd72;
            --globe-shadow: #426f4b;
            --sea-blue: #77a7d7;
            --sea-blue-dark: #4f7ba9;
            --gold: #e0b867;
            --leaf: #a8d883;
            --leaf-deep: #5d8f5d;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background: #05070b;
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
        }

        .topbar {
            height: 62px;
            background: rgba(7, 8, 12, 0.98);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px 0 20px;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .menu-button {
            width: 32px;
            height: 24px;
            position: relative;
            opacity: 0.9;
            display: flex;
            align-items: center;
        }

        .menu-button span {
            display: block;
            position: absolute;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(255,255,255,0.9);
            border-radius: 999px;
        }

        .menu-button span:nth-child(1) { top: 0; }
        .menu-button span:nth-child(2) { top: 10px; }
        .menu-button span:nth-child(3) { top: 20px; }

        .search-icon {
            width: 21px;
            height: 21px;
            border: 2px solid rgba(255,255,255,0.8);
            border-radius: 50%;
            position: relative;
            margin-left: 4px;
        }

        .search-icon::after {
            content: "";
            position: absolute;
            width: 8px;
            height: 2px;
            background: rgba(255,255,255,0.85);
            right: -6px;
            bottom: -1px;
            transform: rotate(44deg);
            border-radius: 999px;
        }

        .brand {
            margin-left: auto;
            color: #f6eff2;
            font-size: 12px;
            letter-spacing: 0.12em;
            font-weight: 700;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .brand .big {
            font-size: 17px;
            font-weight: 700;
            line-height: 1;
            color: #f5e8ee;
        }

        .brand .small {
            font-size: 12px;
            letter-spacing: 0.14em;
            opacity: 0.9;
            margin-left: 1px;
            transform: translateY(1px);
        }

        .hero {
            position: relative;
            width: 100%;
            min-height: calc(100vh - 62px);
            background: linear-gradient(90deg, rgba(43,13,47,1) 0%, rgba(43,13,47,1) 58%, rgba(41, 11, 44, 1) 58%, rgba(41, 11, 44, 1) 100%);
            overflow: hidden;
        }

        .content {
            position: relative;
            width: 100%;
            min-height: calc(100vh - 62px);
            padding-top: 110px;
            padding-left: 90px;
            padding-right: 80px;
        }

        .copy {
            position: relative;
            width: 650px;
            z-index: 2;
            margin-left: 38px;
        }

        .copy p {
            margin: 0;
            color: rgba(255, 245, 250, 0.96);
            font-family: Georgia, "Times New Roman", serif;
            font-style: italic;
            font-weight: 500;
            font-size: clamp(2.15rem, 2.7vw, 3.8rem);
            line-height: 1.12;
            letter-spacing: -0.06em;
            text-wrap: balance;
        }

        .cta-row {
            display: flex;
            gap: 26px;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 220px;
            height: 58px;
            padding: 0 28px;
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: 12px;
            text-decoration: none;
            transition: transform 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            background: linear-gradient(180deg, #c267d4 0%, #a852bf 100%);
            color: #fff;
            box-shadow: 0 8px 18px rgba(193, 95, 214, 0.28);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .btn-secondary {
            background: rgba(13,13,15,0.7);
            color: rgba(255,255,255,0.9);
            border: 1px solid rgba(255,255,255,0.18);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
        }

        .art {
            position: absolute;
            right: 72px;
            top: 26px;
            width: 560px;
            height: 560px;
            z-index: 1;
        }

        .globe-stage {
            position: absolute;
            left: 110px;
            top: 26px;
            width: 310px;
            height: 310px;
        }

        .globe {
            position: absolute;
            left: 34px;
            top: 8px;
            width: 238px;
            height: 238px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 25%, #7ec16f 0%, #72b76d 24%, #4c7c52 60%, #203d31 100%);
            border: 6px solid rgba(213, 207, 182, 0.1);
            overflow: hidden;
            box-shadow: inset 0 0 26px rgba(20,40,30,0.2);
        }

        .globe::before,
        .globe::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
        }

        .globe::before {
            background: linear-gradient(140deg, rgba(255,255,255,0.18), transparent 46%);
        }

        .globe::after {
            background: radial-gradient(circle at 36% 28%, rgba(255,255,255,0.16), transparent 42%);
        }

        .continent {
            position: absolute;
            background: rgba(85, 138, 90, 0.82);
            border-radius: 48% 52% 56% 44% / 46% 40% 60% 54%;
        }

        .continent.one {
            width: 128px;
            height: 78px;
            left: 52px;
            top: 120px;
            transform: rotate(-12deg);
        }

        .continent.two {
            width: 92px;
            height: 62px;
            left: 124px;
            top: 82px;
            transform: rotate(16deg);
            background: rgba(123, 183, 118, 0.85);
        }

        .orbit {
            position: absolute;
            border-radius: 50%;
            border: 4px solid rgba(134, 182, 110, 0.8);
            border-color: rgba(138, 188, 106, 0.75) transparent transparent transparent;
        }

        .orbit.one {
            width: 180px;
            height: 180px;
            left: 28px;
            top: 30px;
            transform: rotate(-26deg);
        }

        .orbit.two {
            width: 250px;
            height: 250px;
            left: 0;
            top: 10px;
            border-color: rgba(224, 184, 103, 0.8) transparent transparent transparent;
            transform: rotate(36deg);
        }

        .stem {
            position: absolute;
            left: 200px;
            top: 44px;
            width: 8px;
            height: 135px;
            background: linear-gradient(180deg, #6da86d 0%, #4b754f 100%);
            border-radius: 999px;
            transform: rotate(18deg);
        }

        .leaf {
            position: absolute;
            width: 72px;
            height: 32px;
            background: linear-gradient(135deg, #afdd84 0%, #619d63 100%);
            border-radius: 60% 40% 60% 40%;
            box-shadow: inset -8px -8px 12px rgba(38,70,44,0.12);
        }

        .leaf.left {
            left: 171px;
            top: 82px;
            transform: rotate(-30deg);
        }

        .leaf.middle {
            left: 196px;
            top: 70px;
            transform: rotate(30deg);
        }

        .leaf.right {
            left: 180px;
            top: 44px;
            transform: rotate(72deg);
        }

        .leaf::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent 46%, rgba(255,255,255,0.25) 46%, rgba(255,255,255,0.25) 54%, transparent 54%);
            border-radius: inherit;
        }

        .people-cluster {
            position: absolute;
            right: 0;
            bottom: 30px;
            width: 210px;
            height: 160px;
        }

        .person {
            position: absolute;
            bottom: 0;
            width: 80px;
            height: 120px;
        }

        .person.left {
            left: 0;
        }

        .person.right {
            left: 110px;
        }

        .person .head {
            position: absolute;
            left: 18px;
            top: 0;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(119, 172, 205, 0.96);
        }

        .person .body {
            position: absolute;
            left: 8px;
            top: 36px;
            width: 60px;
            height: 66px;
            border-radius: 18px 18px 16px 16px;
            background: rgba(93, 142, 172, 0.96);
        }

        .person.right .head {
            background: rgba(224, 184, 103, 0.97);
        }

        .person.right .body {
            background: rgba(201, 166, 84, 0.95);
        }

        .person .torso {
            position: absolute;
            left: 20px;
            top: 76px;
            width: 36px;
            height: 16px;
            border-radius: 6px;
            background: rgba(255,255,255,0.14);
        }

        .shield-panel {
            position: absolute;
            right: 84px;
            bottom: 14px;
            width: 290px;
            height: 180px;
        }

        .shield {
            position: absolute;
            left: 14px;
            top: 0;
            width: 188px;
            height: 164px;
            background: linear-gradient(135deg, rgba(83,150,192,1), rgba(63,120,167,1));
            clip-path: polygon(50% 0%, 90% 18%, 100% 64%, 50% 100%, 0% 64%, 10% 18%);
        }

        .shield::before {
            content: "";
            position: absolute;
            inset: 24px 28px 20px 28px;
            background: rgba(44, 97, 128, 0.2);
            clip-path: polygon(50% 0%, 90% 18%, 100% 64%, 50% 100%, 0% 64%, 10% 18%);
        }

        .check {
            position: absolute;
            left: 74px;
            top: 58px;
            width: 64px;
            height: 26px;
            border-left: 10px solid rgba(228, 239, 247, 0.95);
            border-bottom: 10px solid rgba(228, 239, 247, 0.95);
            transform: rotate(-45deg);
            border-radius: 3px;
        }

        .orbit-small {
            position: absolute;
            left: 70px;
            top: 14px;
            width: 170px;
            height: 170px;
            border-radius: 50%;
            border: 4px solid rgba(124, 158, 188, 0.78);
            border-color: rgba(124, 158, 188, 0.78) transparent transparent transparent;
            transform: rotate(18deg);
        }

        .bars {
            position: absolute;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: end;
            gap: 10px;
            height: 94px;
        }

        .bar {
            width: 15px;
            border-radius: 3px 3px 0 0;
            background: linear-gradient(180deg, rgba(161, 218, 175, 0.9), rgba(86, 149, 117, 0.96));
        }

        .bar:nth-child(1) { height: 58%; }
        .bar:nth-child(2) { height: 40%; }
        .bar:nth-child(3) { height: 72%; }
        .bar:nth-child(4) { height: 82%; }
        .bar:nth-child(5) { height: 54%; }

        @media (max-width: 980px) {
            .content {
                padding: 80px 28px 60px;
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            .copy {
                margin-left: 0;
                width: min(90vw, 650px);
                text-align: center;
            }

            .cta-row {
                justify-content: center;
            }

            .art {
                position: relative;
                right: auto;
                top: auto;
                width: min(90vw, 560px);
                height: 360px;
                margin-top: 30px;
            }

            .globe-stage {
                left: 50%;
                transform: translateX(-50%);
            }

            .shield-panel {
                right: 28px;
                bottom: 0;
                transform: scale(0.92);
                transform-origin: right bottom;
            }
        }

        @media (max-width: 560px) {
            .topbar {
                padding: 0 14px 0 18px;
            }

            .brand .big {
                font-size: 22px;
            }

            .copy p {
                font-size: clamp(1.7rem, 7vw, 2.7rem);
            }

            .btn {
                width: 100%;
                min-width: 100%;
                height: 54px;
            }

            .cta-row {
                width: 100%;
                gap: 16px;
            }

            .art {
                transform: scale(0.82);
                transform-origin: center top;
            }
        }
    </style>
</head>

<body>
    <header class="topbar">
        <div class="topbar-left">
            {% include 'appweb/menu_lateral.html' with pagina_atual='inicio' %}

            <div class="search-icon" aria-label="pesquisa"></div>
        </div>

        <div class="brand">
            <span class="big">ESG</span>
            <span class="small">IMPACT</span>
        </div>
    </header>

    <main class="hero">
        <div class="content">
            <section class="copy">
                <p>
                    Dê o primeiro passo para entender o ESG,<br>
                    conhecer seus impactos e descobrir como<br>
                    a tecnologia pode ajudar sua empresa a<br>
                    agir de forma mais consciente e estratégica.
                </p>

                <div class="cta-row">
                    <a class="btn btn-primary" href="/quem-somos/">
                        Comece aqui
                    </a>
                </div>
            </section>

            <section class="art" aria-label="Illustration">
                <div class="globe-stage">
                    <div class="globe"></div>
                    <div class="orbit one"></div>
                    <div class="orbit two"></div>
                    <div class="stem"></div>
                    <div class="leaf left"></div>
                    <div class="leaf middle"></div>
                    <div class="leaf right"></div>
                </div>

                <div class="people-cluster">
                    <div class="person left">
                        <div class="head"></div>
                        <div class="body"></div>
                        <div class="torso"></div>
                    </div>

                    <div class="person right">
                        <div class="head"></div>
                        <div class="body"></div>
                        <div class="torso"></div>
                    </div>
                </div>

                <div class="shield-panel">
                    <div class="orbit-small"></div>

                    <div class="shield">
                        <div class="check"></div>
                    </div>

                    <div class="bars">
                        <span class="bar"></span>
                        <span class="bar"></span>
                        <span class="bar"></span>
                        <span class="bar"></span>
                        <span class="bar"></span>
                    </div>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
